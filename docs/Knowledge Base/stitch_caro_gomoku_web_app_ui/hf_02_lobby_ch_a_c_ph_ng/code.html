<!DOCTYPE html><html lang="en" style=""><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HF-02 — Lobby, chưa có phòng</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #F6F3EC;
      color: #1C1917;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .font-serif-title {
      font-family: 'Newsreader', serif;
    }
  </style>
</head>
<body class="w-[1440px] h-[900px] overflow-hidden flex flex-col justify-between relative select-none">
  <!-- Top Bar / Chrome -->
  <div>
    

    <!-- App Header -->
    <header class="w-full px-16 py-6 flex items-center justify-between border-b border-[#E7E3D8]/80 bg-[#FAF8F5]/60 backdrop-blur-sm">
      <div class="flex items-center gap-4">
        <span class="font-serif-title text-3xl font-medium tracking-tight text-[#1C1917]">Caro</span>
      </div>
      <div class="flex items-center gap-3"><div class="flex items-center gap-2"><span class="text-sm font-medium text-[#1C1917]">Minh</span><span class="text-xs text-[#78716C] opacity-40">•</span><a href="#" class="text-xs text-[#78716C] hover:text-[#1F7A4D] underline underline-offset-4 decoration-[#D6CDBC] hover:decoration-[#1F7A4D] transition-colors">Not you?</a></div></div>
    </header>
  </div>

  <!-- Main Content Area -->
  <main class="w-full max-w-4xl mx-auto px-8 flex-1 flex flex-col justify-center -mt-8">
    <div class="mb-8">
      <h1 class="text-2xl font-serif-title font-medium text-[#1C1917]">Rooms</h1>
      <p class="text-sm text-[#78716C] mt-1">Waiting rooms you can join</p>
    </div>

    <!-- Empty State Container -->
    <div class="w-full bg-[#FAF8F5] border border-[#E7E3D8] rounded-2xl p-16 text-center shadow-[0_4px_20px_rgb(0,0,0,0.02)] flex flex-col items-center justify-center">
      <div class="w-14 h-14 rounded-full bg-[#EFE9DC]/60 flex items-center justify-center text-[#78716C] mb-4">
        <svg class="w-6 h-6 stroke-[#78716C]" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
      </div>
      <p class="text-base font-normal text-[#78716C] mb-8">No open rooms. Create one to play.</p>

      <button type="button" class="py-3 px-7 bg-[#1F7A4D] hover:bg-[#166534] text-[#FFFFFF] font-medium rounded-xl text-sm transition-all shadow-sm flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        <span class="">Create room</span>
      </button>
    </div>
  </main>

  <!-- Footer -->
  






</body></html>
