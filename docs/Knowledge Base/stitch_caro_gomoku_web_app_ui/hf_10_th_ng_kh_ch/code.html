  <script>
    // Exact same winning marks:
    // Highlighted 5 X's along Row 7: C7(3,7), D7(4,7), E7(5,7), F7(6,7), G7(7,7)
    // O at C8(3,8), D8(4,8), E8(5,8)
    // X at B6(2,6)
    const container = document.getElementById('board-cells');
    const winningX = new Set(['3-7', '4-7', '5-7', '6-7', '7-7']);
    const normalX = new Set(['2-6']);
    const normalO = new Set(['3-8', '4-8', '5-8']);

    for (let r = 1; r <= 15; r++) {
      for (let c = 1; c <= 15; c++) {
        const cell = document.createElement('div');
        const key = `${c}-${r}`;

        if (winningX.has(key)) {
          cell.className = 'w-[32px] h-[32px] border-[0.5px] border-[#1F7A4D] bg-[#DCFCE7] flex items-center justify-center relative cursor-not-allowed shadow-inner z-10';
          cell.innerHTML = '<span class="text-[#166534] font-black text-sm select-none scale-110">✕</span>';
        } else if (normalX.has(key)) {
          cell.className = 'w-[32px] h-[32px] border-[0.5px] border-[#D6CDBC] flex items-center justify-center relative cursor-not-allowed bg-[#FAF8F5]/40';
          cell.innerHTML = '<span class="text-[#1C1917] font-bold text-sm select-none">✕</span>';
        } else if (normalO.has(key)) {
          cell.className = 'w-[32px] h-[32px] border-[0.5px] border-[#D6CDBC] flex items-center justify-center relative cursor-not-allowed bg-[#FAF8F5]/40';
          cell.innerHTML = '<span class="text-[#C2410C] font-bold text-base select-none">○</span>';
        } else {
          cell.className = 'w-[32px] h-[32px] border-[0.5px] border-[#D6CDBC] flex items-center justify-center relative cursor-not-allowed';
          if ((r === 4 || r === 12 || r === 8) && (c === 4 || c === 12 || c === 8)) {
            const dot = document.createElement('div');
            dot.className = 'w-1 h-1 rounded-full bg-[#A8A29E]/50 pointer-events-none';
            cell.appendChild(dot);
          }
        }
        container.appendChild(cell);
      }
    }
  </script>
