<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HF-08 — Tới lượt đối thủ</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
    body {
      background-color: #F6F3EC;
      color: #1C1917;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .font-serif-title {
      font-family: 'Newsreader', serif;
    }
  </style>
</head>
<body class="w-[1440px] h-[900px] overflow-hidden flex flex-col justify-between relative select-none">
<!-- Top Bar / Chrome -->
<div>
<div class="w-full px-12 py-2 bg-[#EFECE4] flex items-center justify-between border-b border-[#E7E3D8] text-xs text-[#78716C]">
<div class="flex items-center gap-2">
<span class="px-2 py-0.5 bg-[#1C1917] text-[#FAF8F5] text-[10px] font-semibold tracking-wider rounded">HF-08</span>
<span class="font-medium text-[#1C1917]">Tới lượt đối thủ</span>
</div>
<span class="font-mono text-[11px]">User: Lan (O) · Minh's turn</span>
</div>
<!-- App Header: Shows "You are Lan · O" & Leave -->
<header class="w-full px-16 py-2.5 flex items-center justify-between border-b border-[#E7E3D8]/80 bg-[#FAF8F5]/60 backdrop-blur-sm">
<div class="flex items-center gap-6">
<span class="font-serif-title text-2xl font-medium tracking-tight text-[#1C1917]">Caro</span>
<div class="h-4 w-px bg-[#E7E3D8]"></div>
<div class="flex items-center gap-2">
<span class="text-xs uppercase tracking-wider text-[#78716C] font-semibold">Room</span>
<span class="px-2.5 py-0.5 bg-[#EFE9DC] text-xs font-mono font-bold text-[#1C1917] rounded border border-[#D6CDBC]">4F2A</span>
</div>
</div>
<div class="flex items-center gap-5">
<div class="flex items-center gap-2 px-3 py-1 bg-[#FAF8F5] border border-[#E7E3D8] rounded-full text-xs font-medium text-[#1C1917]">
<span>You are <strong class="text-[#C2410C]">Lan · O</strong></span>
</div>
<button class="text-xs text-rose-700 bg-rose-50/80 hover:bg-rose-100 border border-rose-200/80 rounded-lg px-3.5 py-1.5 font-medium transition-colors flex items-center gap-1.5 shadow-sm" type="button">
<svg class="w-3.5 h-3.5 text-rose-600" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
<polyline points="16 17 21 12 16 7"></polyline>
<line x1="21" x2="9" y1="12" y2="12"></line>
</svg>
<span>Leave room</span>
</button>
</div>
</header>
</div>
<!-- Main Game Stage -->
<main class="w-full max-w-5xl mx-auto px-8 flex-1 flex flex-col items-center justify-center -mt-2">
<!-- Seats Area: Minh prominent / active turn, Lan waiting -->
<div class="w-[504px] flex items-center justify-between mb-3 px-2">
<!-- Seat 1: Minh · X (Active / To move) -->
<div class="flex items-center gap-3 p-1.5 pr-4 rounded-xl bg-[#FAF8F5] border-2 border-[#1F7A4D] shadow-sm">
<div class="w-8 h-8 rounded-full bg-[#1C1917] text-[#FAF8F5] flex items-center justify-center font-bold text-sm shadow-sm ring-2 ring-[#1F7A4D]">
          ✕
        </div>
<div class="text-left">
<div class="text-sm font-bold text-[#1C1917] leading-tight flex items-center gap-1.5">
            Minh
            <span class="w-1.5 h-1.5 rounded-full bg-[#1F7A4D]"></span>
</div>
<div class="text-[11px] text-[#1F7A4D] font-medium">To move</div>
</div>
</div>
<!-- VS badge -->
<span class="text-xs font-serif-title italic text-[#A8A29E]">vs</span>
<!-- Seat 2: Lan · O (Muted waiting) -->
<div class="flex items-center gap-3 opacity-60 p-1.5 pl-4 rounded-xl">
<div class="text-right">
<div class="text-sm font-medium text-[#78716C] leading-tight">Lan</div>
<div class="text-[11px] text-[#78716C]">Player O · You</div>
</div>
<div class="w-8 h-8 rounded-full bg-[#FAF8F5] border border-[#C2410C] text-[#C2410C] flex items-center justify-center font-bold text-base">
          ○
        </div>
</div>
</div>
<!-- Status Message: Minh's turn -->
<div class="mb-3.5 text-center">
<p class="text-xs font-medium text-[#78716C] tracking-wide flex items-center justify-center gap-2">
<span class="w-2 h-2 rounded-full bg-[#1F7A4D] animate-pulse"></span>
        Minh's turn.
      </p>
</div>
<!-- 15x15 Caro Board (Flat, inactive tones dropped toward page background, no hover, locked) -->
<div class="p-3 bg-[#F4F1EA] rounded-2xl border border-[#DFDAD0] shadow-[0_6px_24px_rgb(0,0,0,0.03)] cursor-default select-none">
<div class="bg-[#F2EEE6] border border-[#DFDAD0] rounded shadow-none">
<div class="grid cursor-default" id="board-cells" style="display:grid; grid-template-columns: repeat(15, 32px); grid-template-rows: repeat(15, 32px); width: 480px; height: 480px;">
<!-- Cells injected by script with exact marks on C3, D4, E5 (X) and C4, D5 (O) -->
</div>
</div>
</div>
</main>
<script>
    // 15x15 Caro board marks matching HF-07:
    // C is col 3, D is col 4, E is col 5
    // X on C3 (3,3), D4 (4,4), E5 (5,5)
    // O on C4 (3,4), D5 (4,5)
    // All cells drawn flat with no hover, inactive tones dropped toward page background
    const container = document.getElementById('board-cells');
    const marks = {
      '3-3': 'X',
      '4-4': 'X',
      '5-5': 'X',
      '3-4': 'O',
      '4-5': 'O'
    };

    for (let r = 1; r <= 15; r++) {
      for (let c = 1; c <= 15; c++) {
        const cell = document.createElement('div');
        const key = `${c}-${r}`;
        const mark = marks[key];

        if (mark === 'X') {
          cell.className = 'w-[32px] h-[32px] border-[0.5px] border-[#DFDAD0] flex items-center justify-center relative cursor-default bg-[#EDE8DE]/40';
          cell.innerHTML = '<span class="text-[#1C1917] font-bold text-sm select-none leading-none">✕</span>';
        } else if (mark === 'O') {
          cell.className = 'w-[32px] h-[32px] border-[0.5px] border-[#DFDAD0] flex items-center justify-center relative cursor-default bg-[#EDE8DE]/40';
          cell.innerHTML = '<span class="text-[#C2410C] font-bold text-base select-none leading-none">○</span>';
        } else {
          // Flat locked empty cell dropped one step toward page background
          cell.className = 'w-[32px] h-[32px] border-[0.5px] border-[#DFDAD0] flex items-center justify-center relative cursor-default';
          // Reference tengen / hoshi points at rows & cols 4, 8, 12
          if ((r === 4 || r === 12 || r === 8) && (c === 4 || c === 12 || c === 8)) {
            const dot = document.createElement('div');
            dot.className = 'w-1.5 h-1.5 rounded-full bg-[#B8B0A2]/50 pointer-events-none';
            cell.appendChild(dot);
          }
        }
        container.appendChild(cell);
      }
    }
  </script>
</body></html>
