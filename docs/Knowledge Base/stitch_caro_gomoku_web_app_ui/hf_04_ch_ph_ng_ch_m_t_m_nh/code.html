<!DOCTYPE html><html lang="en" style=""><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HF-04 — Chủ phòng chờ một mình</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #F6F3EC;
      color: #1C1917;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .font-serif-title {
      font-family: 'Newsreader', serif;
    }
    .board-grid {
      display: grid;
      grid-template-columns: repeat(15, minmax(0, 1fr));
      background-color: #EFE9DC;
      border: 1px solid #D6CDBC;
    }
    .grid-cell {
      width: 32px;
      height: 32px;
      border: 0.5px solid #D6CDBC;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
  </style>

<body class="w-[1440px] h-[900px] overflow-hidden flex flex-col justify-between relative select-none">
  <!-- Top Bar / Chrome -->
  <div>
    

    <!-- App Header with Room ID & Leave -->
    <header class="w-full px-16 py-4 flex items-center justify-between border-b border-[#E7E3D8]/80 bg-[#FAF8F5]/60 backdrop-blur-sm"><div class="flex items-center gap-6"><span class="font-serif-title text-2xl font-medium tracking-tight text-[#1C1917]">Caro</span><div class="h-4 w-px bg-[#E7E3D8]"></div><div class="flex items-center gap-2"><span class="text-xs uppercase tracking-wider text-[#78716C] font-semibold">Room</span><span class="px-2.5 py-0.5 bg-[#EFE9DC] text-xs font-mono font-bold text-[#1C1917] rounded border border-[#D6CDBC]">4F2A</span></div><div class="h-4 w-px bg-[#E7E3D8]"></div><span class="text-xs text-[#78716C] font-medium">You are <span class="text-[#1C1917] font-semibold">Minh</span> · X</span></div><div><button type="button" class="text-xs text-rose-700 bg-rose-50/80 hover:bg-rose-100/90 border border-rose-200/80 rounded-lg px-3.5 py-1.5 font-medium transition-colors flex items-center gap-1.5 shadow-sm"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-rose-600"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg><span class="">Leave room</span></button></div></header>
  </div>

  <!-- Main Game Stage -->
  <main class="w-full max-w-5xl mx-auto px-8 flex-1 flex flex-col items-center justify-center">
    <!-- Seats Area -->
    <div class="w-[480px] flex items-center justify-between mb-5 px-4">
      <!-- Seat 1: Minh -->
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-[#1C1917] text-[#FAF8F5] flex items-center justify-center font-bold text-sm shadow-sm">

        </div>
        <div class="text-left">
          <div class="text-sm font-bold text-[#1C1917] leading-tight">Minh</div>
          <div class="text-[11px] text-[#78716C]">Player X · Host</div>
        </div>
      </div>

      <!-- VS badge -->
      <span class="text-xs font-serif-title italic text-[#A8A29E]">vs</span>

      <!-- Seat 2: Waiting -->
      <div class="flex items-center gap-3 opacity-60">
        <div class="text-right">
          <div class="text-sm font-medium text-[#78716C] leading-tight italic">Waiting for opponent</div>
          <div class="text-[11px] text-[#A8A29E]">Player O</div>
        </div>
        <div class="w-8 h-8 rounded-full border-2 border-dashed border-[#A8A29E] flex items-center justify-center text-[#A8A29E] font-bold text-sm">
          ○
        </div>
      </div>
    </div>

    <!-- Status Message -->
    <div class="mb-5 text-center">
      <p class="text-sm font-medium text-[#78716C] tracking-wide flex items-center justify-center gap-2">

    </div>

  <!-- Script for clean board rendering so markup stays crisp and complete -->
  <script>
    const container = document.querySelector('.board-grid > div > div');
    if (container) {
      container.innerHTML = '';
      for (let r = 1; r <= 15; r++) {
        for (let c = 1; c <= 15; c++) {
          const cell = document.createElement('div');
          cell.className = 'w-[32px] h-[32px] border-[0.5px] border-[#D6CDBC] flex items-center justify-center relative cursor-not-allowed';
          
          // Star points (Hoshi) at standard gomoku coords: (4,4), (4,12), (12,4), (12,12), (8,8)
          if ((r === 4 || r === 12 || r === 8) && (c === 4 || c === 12 || c === 8)) {
            const dot = document.createElement('div');
            dot.className = 'w-1 h-1 rounded-full bg-[#A8A29E]/60 pointer-events-none';
            cell.appendChild(dot);
          }
          container.appendChild(cell);
        }
      }
    }
  </script>
