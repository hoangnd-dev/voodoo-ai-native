-2"><span class="">Join</span></button></div><div class="p-6 flex items-center justify-between transition-colors hover:bg-[#FFFFFF]/60 border-b border-[#E7E3D8]/80"><div class="flex items-center gap-6"><div class="px-3.5 py-1.5 bg-[#EFE9DC]/70 border border-[#D6CDBC] rounded-lg font-mono text-base font-bold text-[#1C1917] tracking-wider">3E9K</div><div class="flex items-center gap-3"><span class="text-sm font-semibold text-[#1C1917]">Tuấn</span><span class="text-[#D6CDBC]">·</span><span class="text-xs text-[#78716C] flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-[#1F7A4D]"></span>waiting</span><span class="text-[#D6CDBC]">·</span><span class="text-xs font-medium text-[#78716C] bg-[#EFE9DC]/50 px-2 py-0.5 rounded-md border border-[#E7E3D8]">1/2</span></div></div><button type="button" class="py-2.5 px-6 bg-[#1F7A4D] hover:bg-[#166534] text-[#FFFFFF] font-medium rounded-xl text-sm transition-colors shadow-sm flex items-center gap-2"><span class="">Join</span></button></div><div class="p-6 flex items-center justify-between transition-colors hover:bg-[#FFFFFF]/60"><div class="flex items-center gap-6"><div class="px-3.5 py-1.5 bg-[#EFE9DC]/70 border border-[#D6CDBC] rounded-lg font-mono text-base font-bold text-[#1C1917] tracking-wider">7H4P</div><div class="flex items-center gap-3"><span class="text-sm font-semibold text-[#1C1917]">Linh</span><span class="text-[#D6CDBC]">·</span><span class="text-xs text-[#78716C] flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-[#1F7A4D]"></span>waiting</span><span class="text-[#D6CDBC]">·</span><span class="text-xs font-medium text-[#78716C] bg-[#EFE9DC]/50 px-2 py-0.5 rounded-md border border-[#E7E3D8]">1/2</span></div></div><button type="button" class="py-2.5 px-6 bg-[#1F7A4D] hover:bg-[#166534] text-[#FFFFFF] font-medium rounded-xl text-sm transition-colors shadow-sm flex items-center gap-2"><span class="">Join</span></button></div></div>
