  <script>
    // Same mark map:
    // X at C3 (col 3, row 3), D4 (col 4, row 4), E5 (col 5, row 5)
    // O at C4 (col 3, row 4), D5 (col 4, row 5)
    // All cells locked with cursor-not-allowed
    const container = document.getElementById('board-cells');
    const marks = {
      '3-3': 'X',
      '4-4': 'X',
      '5-5': 'X',
      '3-4': 'O',
      '4-5': 'O'
    };

    for (let r = 1; r <= 15; r++) {
      for (let c = 1; c <= 15; c++) {
        const cell = document.createElement('div');
        const key = `${c}-${r}`;
        const mark = marks[key];

        if (mark === 'X') {
          cell.className = 'w-[32px] h-[32px] border-[0.5px] border-[#D6CDBC] flex items-center justify-center relative cursor-not-allowed bg-[#FAF8F5]/40';
          cell.innerHTML = '<span class="text-[#1C1917] font-bold text-sm select-none">✕</span>';
        } else if (mark === 'O') {
          cell.className = 'w-[32px] h-[32px] border-[0.5px] border-[#D6CDBC] flex items-center justify-center relative cursor-not-allowed bg-[#FAF8F5]/40';
          cell.innerHTML = '<span class="text-[#C2410C] font-bold text-base select-none">○</span>';
        } else {
          // Locked empty cell
          cell.className = 'w-[32px] h-[32px] border-[0.5px] border-[#D6CDBC] flex items-center justify-center relative cursor-not-allowed';
          if ((r === 4 || r === 12 || r === 8) && (c === 4 || c === 12 || c === 8)) {
            const dot = document.createElement('div');
            dot.className = 'w-1 h-1 rounded-full bg-[#A8A29E]/50 pointer-events-none';
            cell.appendChild(dot);
          }
        }
        container.appendChild(cell);
      }
    }
  </script>
