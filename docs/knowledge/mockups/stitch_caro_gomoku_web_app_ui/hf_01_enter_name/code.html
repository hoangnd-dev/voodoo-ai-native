<!DOCTYPE html><html lang="en" style=""><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HF-01 — Enter name</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #F6F3EC;
      color: #1C1917;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .font-serif-title {
      font-family: 'Newsreader', serif;
    }
  </style>
</head>
<body class="min-h-screen w-full overflow-hidden flex items-center justify-center relative select-none" style="min-width: 1280px; width: 1280px; min-height: 900px; height: 900px; margin: 0px auto; overflow: hidden;">
  <!-- Frame Tag Header -->
  

  <!-- Center Card -->
  <main class="w-full min-h-screen flex items-center justify-center" style="height: 900px; width: 100%; display: flex; align-items: center; justify-content: center;">
    <div class="w-[420px] bg-[#FAF8F5] border border-[#E7E3D8] rounded-2xl p-10 shadow-[0_8px_30px_rgb(0,0,0,0.04)] text-center">
      <h1 class="font-serif-title text-4xl text-[#1C1917] font-medium tracking-tight mb-2">Caro</h1>
      <p class="text-sm text-[#78716C] mb-8 font-normal">Play with a friend</p>

      <form onsubmit="event.preventDefault();" class="text-left space-y-5">
        <div>
          <label for="name" class="block text-xs font-semibold text-[#1C1917] tracking-wider uppercase mb-2">Your name</label>
          <div class="relative">
            <input type="text" id="name" name="name" placeholder="Enter your name" value="" autofocus="" class="w-full px-4 py-3 bg-[#FFFFFF] border-2 rounded-xl text-base text-[#1C1917] placeholder-[#A8A29E] focus:outline-none shadow-sm transition-all border-[#E7E3D8]">
            
          </div>
        </div>

        <button type="button" disabled="" class="w-full py-3.5 px-6 bg-[#E0D8D5] text-[#A8A29E] font-medium rounded-xl text-sm transition-colors flex items-center justify-center gap-2 mt-2 cursor-not-allowed opacity-75"><span class="">Continue</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg></button>
      </form>
    </div>
  </main>

  <!-- Footer Subtle Info -->
  






</body></html>
