<!DOCTYPE html><html lang="en" style=""><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HF-05 — Chủ phòng, sẵn sàng Start</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #F6F3EC;
      color: #1C1917;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .font-serif-title {
      font-family: 'Newsreader', serif;
    }
  </style>
</head>
<body class="w-[1440px] h-[900px] overflow-hidden flex flex-col justify-between relative select-none">
  <!-- Top Bar / Chrome -->
  <div>
    

    <!-- App Header with Room ID & Leave -->
    <header class="w-full px-16 py-4 flex items-center justify-between border-b border-[#E7E3D8]/80 bg-[#FAF8F5]/60 backdrop-blur-sm">
      <div class="flex items-center gap-6">
        <span class="font-serif-title text-2xl font-medium tracking-tight text-[#1C1917]">Caro</span>
        <div class="h-4 w-px bg-[#E7E3D8]"></div>
        <div class="flex items-center gap-2">
          <span class="text-xs uppercase tracking-wider text-[#78716C] font-semibold">Room</span>
          <span class="px-2.5 py-0.5 bg-[#EFE9DC] text-xs font-mono font-bold text-[#1C1917] rounded border border-[#D6CDBC]">4F2A</span>
        </div>
      <div class="h-4 w-px bg-[#E7E3D8]"></div><div class="text-xs text-[#78716C]"><span class="text-[#A8A29E]">You are </span><span class="font-semibold text-[#1C1917]">Minh</span> <span class="font-bold text-[#1C1917]">· X</span></div></div>
      <div>
        <button type="button" class="text-xs text-rose-700 bg-rose-50/80 hover:bg-rose-100 border border-rose-200/80 font-medium px-3.5 py-1.5 rounded-lg transition-colors flex items-center gap-1.5 shadow-sm"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg><span class="">Leave room</span></button>
      </div>
    </header>
  </div>

  <!-- Main Game Stage -->
  <main class="w-full max-w-5xl mx-auto px-8 flex-1 flex flex-col items-center justify-center py-2"><!-- Seats Block / Card -->
<div class="w-[520px] bg-[#FAF8F5] border border-[#D6CDBC] rounded-2xl p-3.5 mb-3 shadow-[0_8px_30px_rgb(0,0,0,0.04)] flex items-center justify-between">
  <!-- Seat 1: Minh (Host · X) -->
  <div class="flex items-center gap-3">
    <div class="w-9 h-9 rounded-full bg-[#1C1917] text-[#FAF8F5] flex items-center justify-center font-bold text-base shadow-sm ring-2 ring-[#1C1917]/10">
      ✕
    </div>
    <div class="text-left">
      <div class="flex items-center gap-1.5">
        <span class="text-sm font-bold text-[#1C1917] leading-tight">Minh</span>
        <span class="text-[10px] font-semibold px-1.5 py-0.2 bg-[#EFE9DC] text-[#78716C] rounded border border-[#D6CDBC]">You</span>
      </div>
      <div class="text-xs text-[#78716C]">Player X · Host</div>
    </div>
  </div>

  <!-- VS & Status Pill -->
  <div class="flex flex-col items-center gap-0.5">
    <span class="font-serif-title italic text-sm text-[#A8A29E]">vs</span>
    <span class="text-[11px] font-semibold text-[#1F7A4D] bg-[#1F7A4D]/10 px-2 py-0.5 rounded-full flex items-center gap-1">
      <span class="w-1.5 h-1.5 rounded-full bg-[#1F7A4D]"></span>Ready
    </span>
  </div>

  <!-- Seat 2: Lan (Guest · O) -->
  <div class="flex items-center gap-3">
    <div class="text-right">
      <div class="text-sm font-bold text-[#1C1917] leading-tight">Lan</div>
      <div class="text-xs text-[#C2410C] font-medium">Player O · Guest</div>
    </div>
    <div class="w-9 h-9 rounded-full bg-[#FAF8F5] border-2 border-[#C2410C] text-[#C2410C] flex items-center justify-center font-bold text-lg shadow-sm ring-2 ring-[#C2410C]/10">
      ○
    </div>
  </div>
</div>

<!-- Status Helper Message -->
<div class="mb-3 text-center">
  <p class="text-xs font-medium text-[#78716C] tracking-wide flex items-center justify-center gap-1.5">
    <span class="w-2 h-2 rounded-full bg-[#1F7A4D]"></span>
    <span class="font-semibold text-[#1C1917]">Lan</span> joined the room. Start the game when you're ready.
  </p>
</div>

<!-- 15x15 Caro Board Block (Waiting / Locked state with card treatment) -->
<div class="relative bg-[#FAF8F5] p-3 rounded-2xl border border-[#D6CDBC] shadow-[0_8px_30px_rgb(0,0,0,0.04)] select-none">
  <!-- The Board Canvas (Dimmed opacity for locked effect) -->
  <div class="w-[480px] h-[480px] bg-[#EFE9DC] border border-[#D6CDBC] rounded-xl shadow-inner overflow-hidden opacity-60 cursor-not-allowed">
    <svg viewBox="0 0 480 480" class="w-full h-full pointer-events-none" xmlns="http://www.w3.org/2000/svg">
      <!-- Grid Lines 15x15 (step = 32px, margin = 16px) -->
      <defs>
        <pattern id="caro-grid-locked" width="32" height="32" patternUnits="userSpaceOnUse">
          <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#D6CDBC" stroke-width="1"></path>
        </pattern>
      </defs>
      <rect x="16" y="16" width="448" height="448" fill="url(#caro-grid-locked)" stroke="#D6CDBC" stroke-width="1.5"></rect>
      <!-- Star points (hoshi points at (4,4), (4,12), (8,8), (12,4), (12,12)) -->
      <circle cx="112" cy="112" r="3.5" fill="#A8A29E"></circle>
      <circle cx="368" cy="112" r="3.5" fill="#A8A29E"></circle>
      <circle cx="240" cy="240" r="4" fill="#A8A29E"></circle>
      <circle cx="112" cy="368" r="3.5" fill="#A8A29E"></circle>
      <circle cx="368" cy="368" r="3.5" fill="#A8A29E"></circle>
    </svg>
  </div>

  <!-- Centered Blocked Pill Card Overlay -->
  <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
    <div class="bg-[#FAF8F5]/95 backdrop-blur-md px-5 py-2.5 rounded-full border border-[#D6CDBC] shadow-lg flex items-center gap-2.5">
      <div class="w-6 h-6 rounded-full bg-[#EFE9DC] flex items-center justify-center text-[#78716C]">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
        </svg>
      </div>
      <div class="text-left">
        <div class="text-xs font-bold text-[#1C1917] leading-none">Waiting to start</div>
        <div class="text-[11px] text-[#78716C] mt-0.5">Host needs to press Start to begin</div>
      </div>
    </div>
  </div>
</div>

<!-- Host Start Button -->
<div class="mt-4 flex items-center justify-center">
  <button type="button" class="py-2.5 px-8 bg-[#1F7A4D] hover:bg-[#166534] text-[#FFFFFF] font-semibold rounded-xl text-sm transition-all shadow-md hover:shadow-lg flex items-center gap-2 hover:-translate-y-0.5 active:translate-y-0">
    <span class="">Start game</span>
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
    </svg>
  </button>
</div></main>

  <script>
    const container = document.getElementById('board-cells');
    for (let r = 1; r <= 15; r++) {
      for (let c = 1; c <= 15; c++) {
        const cell = document.createElement('div');
        cell.className = 'w-[32px] h-[32px] border-[0.5px] border-[#D6CDBC] flex items-center justify-center relative cursor-not-allowed';
        if ((r === 4 || r === 12 || r === 8) && (c === 4 || c === 12 || c === 8)) {
          const dot = document.createElement('div');
          dot.className = 'w-1 h-1 rounded-full bg-[#A8A29E]/60 pointer-events-none';
          cell.appendChild(dot);
        }
        container.appendChild(cell);
      }
    }
  </script>

  <!-- Footer -->
  










</body></html>
