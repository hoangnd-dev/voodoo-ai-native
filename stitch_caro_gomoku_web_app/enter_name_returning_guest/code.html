<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"primary-fixed-dim":"#b4c5ff","on-primary-fixed-variant":"#003ea8","error-container":"#ffdad6","secondary":"#904d00","on-tertiary-container":"#ffede6","on-secondary":"#ffffff","on-tertiary-fixed":"#360f00","surface-variant":"#dae2fd","on-error-container":"#93000a","secondary-fixed-dim":"#ffb77d","outline-variant":"#c3c6d7","background":"#faf8ff","surface-container-low":"#f2f3ff","inverse-on-surface":"#eef0ff","on-secondary-container":"#663500","tertiary-fixed":"#ffdbcd","surface-container-lowest":"#ffffff","on-primary":"#ffffff","outline":"#737686","primary-fixed":"#dbe1ff","surface-bright":"#faf8ff","surface-container-highest":"#dae2fd","error":"#ba1a1a","on-primary-container":"#eeefff","secondary-container":"#fe932c","inverse-primary":"#b4c5ff","on-surface-variant":"#434655","on-secondary-fixed":"#2f1500","on-tertiary":"#ffffff","surface-tint":"#0053db","surface-container-high":"#e2e7ff","inverse-surface":"#283044","surface-dim":"#d2d9f4","surface-container":"#eaedff","on-surface":"#131b2e","tertiary":"#943700","on-error":"#ffffff","primary-container":"#2563eb","on-primary-fixed":"#00174b","on-secondary-fixed-variant":"#6e3900","secondary-fixed":"#ffdcc3","on-background":"#131b2e","tertiary-fixed-dim":"#ffb596","on-tertiary-fixed-variant":"#7d2d00","primary":"#004ac6","surface":"#faf8ff","tertiary-container":"#bc4800"},"borderRadius":{"DEFAULT":"0.125rem","lg":"0.25rem","xl":"0.5rem","full":"0.75rem"},"spacing":{"space-md":"1rem","space-xs":"0.25rem","space-lg":"1.5rem","gutter":"1.5rem","margin":"2rem","space-sm":"0.5rem","space-xl":"2rem"},"fontFamily":{"label-lg":["Inter"],"glyph-board":["Inter"],"body-lg":["Inter"],"label-md":["Inter"],"body-sm":["Inter"],"headline-lg":["Inter"],"headline-md":["Inter"],"metric-timer":["Inter"],"label-sm":["Inter"],"headline-sm":["Inter"],"body-md":["Inter"]},"fontSize":{"label-lg":["14px",{"lineHeight":"20px","letterSpacing":"0.01em","fontWeight":"600"}],"glyph-board":["22px",{"lineHeight":"22px","letterSpacing":"0em","fontWeight":"700"}],"body-lg":["16px",{"lineHeight":"24px","letterSpacing":"0em","fontWeight":"400"}],"label-md":["12px",{"lineHeight":"16px","letterSpacing":"0.02em","fontWeight":"500"}],"body-sm":["12px",{"lineHeight":"16px","letterSpacing":"0.01em","fontWeight":"400"}],"headline-lg":["32px",{"lineHeight":"40px","letterSpacing":"-0.02em","fontWeight":"600"}],"headline-md":["24px",{"lineHeight":"32px","letterSpacing":"-0.015em","fontWeight":"600"}],"metric-timer":["28px",{"lineHeight":"32px","letterSpacing":"-0.02em","fontWeight":"500"}],"label-sm":["11px",{"lineHeight":"14px","letterSpacing":"0.04em","fontWeight":"600"}],"headline-sm":["18px",{"lineHeight":"24px","letterSpacing":"-0.01em","fontWeight":"600"}],"body-md":["14px",{"lineHeight":"20px","letterSpacing":"0em","fontWeight":"400"}]}}}}</script></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased"><main class="w-full min-h-screen flex items-center justify-center p-margin bg-surface"><div class="flex flex-col w-full items-center justify-center min-h-[calc(100vh-4rem)] relative select-none">
<!-- Subtle Architectural Atmospheric Gradients -->
<div class="absolute -top-32 -left-32 w-96 h-96 bg-primary-fixed-dim/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-32 -right-32 w-96 h-96 bg-surface-variant/40 rounded-full blur-3xl pointer-events-none"></div>
<!-- Decorative Minimalist Gomoku Grid Watermark (Static Canvas Hint) -->
<div class="absolute inset-0 flex items-center justify-center opacity-[0.035] pointer-events-none overflow-hidden">
<svg class="text-on-surface" fill="none" height="720" viewBox="0 0 720 720" width="720">
<defs>
<pattern height="48" id="grid-pattern" patternUnits="userSpaceOnUse" width="48">
<path d="M 48 0 L 0 0 0 48" fill="none" stroke="currentColor" stroke-width="1.5"></path>
</pattern>
</defs>
<rect fill="url(#grid-pattern)" height="720" width="720"></rect>
<!-- Star points (Hoshi) -->
<circle cx="192" cy="192" fill="currentColor" r="4"></circle>
<circle cx="528" cy="192" fill="currentColor" r="4"></circle>
<circle cx="360" cy="360" fill="currentColor" r="5"></circle>
<circle cx="192" cy="528" fill="currentColor" r="4"></circle>
<circle cx="528" cy="528" fill="currentColor" r="4"></circle>
</svg>
</div>
<!-- Centered Access Card -->
<div class="relative w-full max-w-md bg-surface-container-lowest shadow-xl rounded-xl p-space-xl flex flex-col z-10 transition-all duration-300">
<!-- Header Unit: Brand Wordmark & Tactical Status -->
<div class="flex items-center justify-between pb-space-lg">
<div class="flex items-center gap-space-xs">
<!-- Gomoku Intersect Mark -->
<div class="w-8 h-8 rounded-lg bg-surface-container flex items-center justify-center text-primary">
<svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-width="2.5" viewBox="0 0 24 24" width="18">
<line x1="12" x2="12" y1="2" y2="22"></line>
<line x1="2" x2="22" y1="12" y2="12"></line>
<circle class="fill-primary" cx="12" cy="12" r="3"></circle>
</svg>
</div>
<span class="font-headline-sm text-headline-sm text-on-surface tracking-tight font-semibold">Caro</span>
</div>
<!-- Tactical Session Badge -->

</div>
<!-- Hero Greeting Segment -->
<div class="flex flex-col space-y-1 mb-space-lg">
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">Continue as Minh</h1>
<p class="font-body-md text-body-md text-on-surface-variant">This browser remembered your name.</p>
</div>
<!-- Active Identification Form -->
<form class="flex flex-col gap-space-lg" id="continue-form" onsubmit="event.preventDefault(); handleSubmit();">
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center justify-between" for="player-name">
<span class="">Display Name</span>
<span class="font-body-sm text-body-sm text-outline">Stored in browser</span>
</label>
<div class="relative flex items-center">
<input autocomplete="nickname" class="w-full bg-surface-container-low text-on-surface font-body-lg text-body-lg px-4 py-3 rounded-lg outline-none transition-colors duration-150 focus:bg-surface-container focus:text-on-surface hover:bg-surface-container-high/60 cursor-text" id="player-name" name="playerName" type="text" value="Minh">
<div class="absolute right-3.5 flex items-center pointer-events-none text-primary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</div>
<!-- Action Array -->
<div class="flex flex-col gap-space-sm pt-space-xs">
<!-- Primary Action: Continue -->
<button class="w-full bg-inverse-surface hover:bg-on-surface text-surface-container-lowest font-label-lg text-label-lg py-3 px-space-lg rounded-lg shadow-sm active:scale-[0.99] transition-all duration-150 flex items-center justify-center gap-2 group cursor-pointer" id="btn-continue" type="submit">
<span class="">Continue</span>
<span class="material-symbols-outlined text-[18px] group-hover:translate-x-0.5 transition-transform duration-150">arrow_forward</span>
</button>
<!-- Secondary Quiet Action -->
<button class="w-full bg-transparent hover:bg-surface-container-low text-on-surface-variant hover:text-on-surface font-label-md text-label-md py-2.5 px-space-md rounded-lg transition-colors duration-150 text-center cursor-pointer" id="btn-different-name" onclick="handleDifferentName()" type="button">
          Use a different name
        </button>
</div>
</form>
<!-- Contextual Architectural Divider & Helper -->
<div class="mt-space-lg pt-space-md bg-transparent flex items-start gap-2.5 text-on-surface-variant">
<span class="material-symbols-outlined text-outline text-[18px] shrink-0 mt-0.5">cookie</span>
<p class="font-body-sm text-body-sm leading-relaxed text-outline">
        No account. This browser will remember your name.
      </p>
</div>
</div>
<!-- Decorative Minimal Footnote for Desktop Perspective -->

</div>
<script>
  function handleSubmit() {
    const input = document.getElementById('player-name');
    const name = input.value.trim() || 'Minh';
    const btn = document.getElementById('btn-continue');
    
    btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span><span>Entering...</span>`;
    btn.disabled = true;
    btn.classList.add('opacity-80', 'pointer-events-none');
    
    // Simulate instantaneous zero-friction entry transition
    setTimeout(() => {
      btn.innerHTML = `<span class="material-symbols-outlined text-[18px]">done</span><span>Ready</span>`;
    }, 400);
  }

  function handleDifferentName() {
    const input = document.getElementById('player-name');
    input.value = '';
    input.focus();
    input.placeholder = 'Type your name';
    
    const heading = document.querySelector('h1');
    heading.textContent = 'Enter your name';
  }
</script></main>

</body></html>
