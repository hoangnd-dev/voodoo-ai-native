<script>
  (function initFinishedBoard() {
    const boardEl = document.getElementById('board');
    if (!boardEl) return;

    // Board Dimension: 15x15
    // Finished state matching the owner win mock:
    // Winning 5-in-a-row diagonal by X:
    // (4, 4), (5, 5), (6, 6), (7, 7), (8, 8) in 0-indexed [row, col]
    const winningStreak = [
      [4, 4],
      [5, 5],
      [6, 6],
      [7, 7],
      [8, 8]
    ];

    const moves = {
      // Winning sequence for X
      '4,4': { type: 'X', isWin: true },
      '5,5': { type: 'X', isWin: true },
      '6,6': { type: 'X', isWin: true },
      '7,7': { type: 'X', isWin: true },
      '8,8': { type: 'X', isWin: true, lastMove: true },

      // Other X moves
      '3,6': { type: 'X' },
      '4,7': { type: 'X' },
      '5,3': { type: 'X' },
      '6,4': { type: 'X' },
      '7,9': { type: 'X' },
      '8,5': { type: 'X' },
      '9,6': { type: 'X' },
      '9,7': { type: 'X' },
      '10,5': { type: 'X' },

      // Lan's O moves (interspersed counter-play)
      '3,5': { type: 'O' },
      '4,5': { type: 'O' },
      '5,6': { type: 'O' },
      '5,7': { type: 'O' },
      '6,5': { type: 'O' },
      '6,7': { type: 'O' },
      '7,6': { type: 'O' },
      '7,8': { type: 'O' },
      '8,6': { type: 'O' },
      '8,7': { type: 'O' },
      '9,8': { type: 'O' },
      '9,5': { type: 'O' },
      '10,6': { type: 'O' }
    };

    const fragment = document.createDocumentFragment();

    for (let r = 0; r < 15; r++) {
      for (let c = 0; c < 15; c++) {
        const key = `${r},${c}`;
        const cell = document.createElement('div');
        cell.className = 'relative flex items-center justify-center aspect-square w-full h-full';

        const piece = moves[key];
        if (piece) {
          const mark = document.createElement('span');
          mark.className = 'font-glyph-board text-glyph-board font-bold flex items-center justify-center transition-transform';

          if (piece.type === 'X') {
            mark.textContent = '✕';
            if (piece.isWin) {
              // Highlighted winning piece
              mark.className += ' text-primary scale-110 drop-shadow-sm';
              // Win highlight tile background
              const highlight = document.createElement('div');
              highlight.className = 'absolute inset-1 rounded-full bg-primary-fixed/60 z-0 animate-pulse';
              cell.appendChild(highlight);
            } else {
              mark.className += ' text-primary-container';
            }

            if (piece.lastMove) {
              // Marker badge for terminal winning piece
              const lastDot = document.createElement('span');
              lastDot.className = 'absolute -top-0.5 right-1 w-2 h-2 rounded-full bg-primary z-20';
              cell.appendChild(lastDot);
            }
          } else {
            mark.textContent = '◯';
            mark.className += ' text-secondary-container';
          }

          mark.style.zIndex = '10';
          cell.appendChild(mark);
        }

        fragment.appendChild(cell);
      }
    }

    boardEl.appendChild(fragment);
  })();
</script></div></main>
