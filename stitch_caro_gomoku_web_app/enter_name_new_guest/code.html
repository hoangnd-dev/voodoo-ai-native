.5rem","space-xl":"2rem"},"fontFamily":{"label-lg":["Inter"],"glyph-board":["Inter"],"body-lg":["Inter"],"label-md":["Inter"],"body-sm":["Inter"],"headline-lg":["Inter"],"headline-md":["Inter"],"metric-timer":["Inter"],"label-sm":["Inter"],"headline-sm":["Inter"],"body-md":["Inter"]},"fontSize":{"label-lg":["14px",{"lineHeight":"20px","letterSpacing":"0.01em","fontWeight":"600"}],"glyph-board":["22px",{"lineHeight":"22px","letterSpacing":"0em","fontWeight":"700"}],"body-lg":["16px",{"lineHeight":"24px","letterSpacing":"0em","fontWeight":"400"}],"label-md":["12px",{"lineHeight":"16px","letterSpacing":"0.02em","fontWeight":"500"}],"body-sm":["12px",{"lineHeight":"16px","letterSpacing":"0.01em","fontWeight":"400"}],"headline-lg":["32px",{"lineHeight":"40px","letterSpacing":"-0.02em","fontWeight":"600"}],"headline-md":["24px",{"lineHeight":"32px","letterSpacing":"-0.015em","fontWeight":"600"}],"metric-timer":["28px",{"lineHeight":"32px","letterSpacing":"-0.02em","fontWeight":"500"}],"label-sm":["11px",{"lineHeight":"14px","letterSpacing":"0.04em","fontWeight":"600"}],"headline-sm":["18px",{"lineHeight":"24px","letterSpacing":"-0.01em","fontWeight":"600"}],"body-md":["14px",{"lineHeight":"20px","letterSpacing":"0em","fontWeight":"400"}]}}}}</script></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased"><main class="w-full min-h-screen flex items-center justify-center p-margin bg-surface"><div class="flex flex-col w-full items-center justify-center min-h-[calc(100vh-4rem)]">
<div class="relative w-full max-w-[440px] px-space-md">
<!-- Geometric Architectural Underlay Accent -->
<div class="absolute -top-10 -right-6 w-32 h-32 bg-primary-fixed-dim/20 rounded-full blur-2xl pointer-events-none"></div>
<div class="absolute -bottom-8 -left-6 w-28 h-28 bg-surface-variant/40 rounded-full blur-xl pointer-events-none"></div>
<!-- Centered Tactile Identity Card -->
<div class="relative bg-surface-container-lowest shadow-xl rounded-xl p-space-xl flex flex-col">
<!-- Minimalist Brand Header -->
<div class="flex flex-col space-y-space-xs mb-space-lg text-left">
<div class="flex items-center justify-between">
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Caro</h1>

</div>
<p class="font-body-md text-body-md text-on-surface-variant">Play a short match with a friend.</p>
</div>
<!-- Identity Capture Form -->
<form class="flex flex-col space-y-space-lg" id="enter-name-form" onsubmit="event.preventDefault(); handleSubmit();">
<div class="flex flex-col space-y-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-lg text-label-lg text-on-surface" for="player-name">Your name</label>

</div>
<div class="relative flex items-center">
<input autocomplete="name" autofocus="" class="w-full bg-surface-container-low text-on-surface font-body-lg text-body-lg px-space-md py-space-sm rounded-lg outline-none transition-colors duration-150 placeholder:text-outline/50" id="player-name" maxlength="20" name="playerName" placeholder="Minh" spellcheck="false" type="text">
</div>
</div>
<button class="w-full py-space-sm px-space-md rounded-lg font-label-lg text-label-lg transition-all duration-150 flex items-center justify-center space-x-space-xs bg-surface-container text-outline cursor-not-allowed select-none" disabled="" id="submit-btn" type="submit">
<span class="">Continue</span>
<span class="material-symbols-outlined text-[18px] transition-transform duration-150" id="btn-icon">arrow_forward</span>
</button>
<!-- Frictionless Reassurance Note -->
<div class="flex items-center justify-center space-x-1.5 pt-space-xs text-center">
<span class="material-symbols-outlined text-outline text-[15px] select-none">lock</span>
<p class="font-body-sm text-body-sm text-outline">No account. This browser will remember your name.</p>
</div>
</form>
</div>
<!-- Quiet Version Signature -->

</div>
</div>
<script>
  const nameInput = document.getElementById('player-name');
  const submitBtn = document.getElementById('submit-btn');
  const charCounter = document.getElementById('char-counter');
  const btnIcon = document.getElementById('btn-icon');

  function updateFormState() {
    const rawValue = nameInput.value;
    const trimmedValue = rawValue.trim();
    
    charCounter.textContent = `${rawValue.length} / 20`;

    if (trimmedValue.length > 0) {
      submitBtn.removeAttribute('disabled');
      submitBtn.classList.remove('bg-surface-container', 'text-outline', 'cursor-not-allowed');
      submitBtn.classList.add('bg-on-surface', 'text-surface-container-lowest', 'hover:bg-inverse-surface', 'cursor-pointer');
      nameInput.classList.remove('bg-surface-container-low');
      nameInput.classList.add('bg-surface-container');
    } else {
      submitBtn.setAttribute('disabled', 'true');
      submitBtn.classList.add('bg-surface-container', 'text-outline', 'cursor-not-allowed');
      submitBtn.classList.remove('bg-on-surface', 'text-surface-container-lowest', 'hover:bg-inverse-surface', 'cursor-pointer');
      nameInput.classList.add('bg-surface-container-low');
      nameInput.classList.remove('bg-surface-container');
    }
  }

  nameInput.addEventListener('input', updateFormState);

  function handleSubmit() {
    const finalName = nameInput.value.trim();
    if (!finalName) return;

    try {
      localStorage.setItem('caro_player_name', finalName);
    } catch (e) {}

    submitBtn.classList.add('opacity-80');
    submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span>';
  }
</script></main>

</body></html>
